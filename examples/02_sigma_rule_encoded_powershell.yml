title: Suspicious Encoded PowerShell Execution with Hidden Window
id: a891f7c2-3e4b-4b19-8651-7f89b9101234
status: experimental
description: Detects PowerShell command line execution utilizing base64 encoded commands combined with hidden window parameters.
author: CyberQwen-2B
date: 2026-11-13
references:
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - '-enc '
            - '-encodedcommand '
            - '-e '
    selection_window:
        CommandLine|contains:
            - '-w hidden'
            - '-windowstyle hidden'
            - '-win hidden'
    condition: selection_process and selection_flags and selection_window
fields:
    - CommandLine
    - ParentProcessName
    - User
falsepositives:
    - Legitimate administrative orchestration scripts (SCCM, Ansible)
level: high
